name: Daily traffic total

# Pulls the PREVIOUS UTC day's total edge request count (cache HITs included)
# from Vercel's own Observability Metrics and POSTs it to this app's
# pages/api/drains/traffic-total.js, which merges it into that day's
# drain:daily rollup — see that file and lib/drain-store.js for why this has
# to be a separate pipeline: a Vercel Function can't reach this data itself
# (CLAUDE.md Outstanding item 2b), so `vercel metrics` (a stable, versioned
# CLI, not the underlying HTTP endpoint) is run here instead, in CI, where
# the broadly-scoped token this needs never has to touch the app's own
# production runtime.
#
# Runs after the drain rollup cron (00:10 UTC, see vercel.json) so a same-day
# "which ran first" isn't a concern in practice, though the merge in
# writeDailySummary() tolerates either order.
#
# Required repo secrets:
#   VERCEL_TOKEN            token with metrics access on this project
#   VERCEL_ORG_ID            team/org id `vercel metrics` needs to scope to
#   VERCEL_PROJECT_ID       this project's id
#   TRAFFIC_TOTAL_API_TOKEN  matches TRAFFIC_TOTAL_API_TOKEN in Vercel's env
# Optional repo variable:
#   SITE_URL                 defaults to https://www.global-warming.org

on:
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to (re-)report, YYYY-MM-DD. Defaults to yesterday."
        required: false

jobs:
  report-traffic-total:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target day
        id: day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "start=${DATE}T00:00:00.000Z" >> "$GITHUB_OUTPUT"
          echo "end=${DATE}T23:59:59.999Z" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.1

      - name: Query Vercel metrics
        id: metrics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel metrics vercel.request.count \
            --prod \
            -f "contains(request_path, '/api')" \
            --group-by cache_result \
            --since "${{ steps.day.outputs.start }}" \
            --until "${{ steps.day.outputs.end }}" \
            --json \
            --token "$VERCEL_TOKEN" \
            --scope "${{ secrets.VERCEL_ORG_ID }}" \
            -p "${{ secrets.VERCEL_PROJECT_ID }}" \
            > metrics.json
          cat metrics.json

          TOTAL=$(jq '[.summary[].vercel_request_count_sum] | add // 0' metrics.json)
          BREAKDOWN=$(jq -c '
            [ .summary[] | { (if .cache_result == "" then "UNSET" else .cache_result end): .vercel_request_count_sum } ]
            | add // {}
          ' metrics.json)

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "breakdown=$BREAKDOWN" >> "$GITHUB_OUTPUT"

      - name: Report total to the app
        env:
          TRAFFIC_TOTAL_API_TOKEN: ${{ secrets.TRAFFIC_TOTAL_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          URL="${SITE_URL:-https://www.global-warming.org}/api/drains/traffic-total"
          BODY=$(jq -n \
            --arg date "${{ steps.day.outputs.date }}" \
            --argjson totalRequests "${{ steps.metrics.outputs.total }}" \
            --argjson breakdown '${{ steps.metrics.outputs.breakdown }}' \
            '{date: $date, totalRequests: $totalRequests, breakdown: $breakdown}')

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer $TRAFFIC_TOTAL_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          cat response.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "traffic-total POST failed with HTTP $HTTP_CODE"
            exit 1
          fi
